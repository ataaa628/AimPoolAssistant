
name: Build AimPool APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ZIP not found"
            exit 1
          fi
          unzip -o "$ZIP" -d .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"


      - name: Fix Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions" not in s:
              s = s.replace(
                  "    compileSdk = 35",
                  """    compileSdk = 35
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }""",
                  1
              )

          if "kotlinOptions" not in s:
              s = s.replace(
                  "    defaultConfig {",
                  """    kotlinOptions {
                  jvmTarget = "17"
              }

              defaultConfig {""",
                  1
              )

          p.write_text(s)
          PY

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AimPoolAssistant-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
